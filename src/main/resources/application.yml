spring:
  application:
    name: bankcore-backend

  datasource:
    url: jdbc:postgresql://localhost:5434/bankcore
    username: bankcore_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
